name: python-ci

on:
  pull_request:
    branches:
      - main
      - 'release/**'
    paths:
      - 'normcore-py/**'
      - '.github/workflows/python-ci.yml'
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - 'normcore-py/**'
      - '.github/workflows/python-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: normcore-py
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install test dependencies
        run: uv sync --extra test

      - name: Run Python tests
        run: uv run --python .venv/bin/python --extra test -m pytest
