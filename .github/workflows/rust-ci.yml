name: rust-ci

on:
  pull_request:
    branches:
      - main
      - 'release/**'
    paths:
      - 'normcore-rs/**'
      - 'rustfmt.toml'
      - 'justfile'
      - '.github/workflows/rust-ci.yml'
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - 'normcore-rs/**'
      - 'rustfmt.toml'
      - 'justfile'
      - '.github/workflows/rust-ci.yml'
  workflow_dispatch:

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check --manifest-path normcore-rs/Cargo.toml
      - run: cargo clippy --all-targets --all-features --manifest-path normcore-rs/Cargo.toml -- -D warnings
      - run: cargo test --all-features --manifest-path normcore-rs/Cargo.toml

  publish-dry-run:
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run --manifest-path normcore-rs/Cargo.toml
